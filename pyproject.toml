[project]
name = "baska-diagramy"
version = "0.1.0"
description = "Generator PNG ze stanami gry Baśka (4 gracze, ręce, stos)"
readme = "README.md"
authors = [
    { name = "kajtek14102", email = "kajtek14102@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
baska-diagramy = "baska_diagramy:main"
baska-diagramy-gui = "baska_diagramy.gui:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
